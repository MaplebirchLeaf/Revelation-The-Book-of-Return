# ./.github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mod and protection tool
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Verify release tag
        run: |
          version="$(bun -e "console.log(require('./package.json').version)")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd tools/dol-mod-protection-tools && bun install --frozen-lockfile)

      - name: Check and build
        run: |
          bun run check
          bun run typecheck
          bun run build:all

      - name: Encrypt without player credentials
        run: bun run scripts/protected-release.ts

      - name: Publish modpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(package/*.modpack)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected one encrypted modpack, found ${#packages[@]}" >&2
            exit 1
          fi
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${packages[0]}" --verify-tag \
            --title "Revelation: The Book of Return ${GITHUB_REF_NAME}" --notes-file "$notes"
