name: Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'types/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: |
          bun install --frozen-lockfile
          (cd tools/dol-mod-protection-tools && bun install --frozen-lockfile)
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
